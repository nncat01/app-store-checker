name: Update app registry

on:
  schedule:
    # 06:00, 14:00, 22:00 UTC — три запуска в сутки.
    # Время в UTC, не забудь пересчитать под свой часовой пояс при желании.
    - cron: "0 6,14,22 * * *"
  workflow_dispatch: {}  # позволяет запускать вручную из вкладки Actions

# Не даёт двум запускам работать одновременно и пушить параллельно — если
# новый запуск стартует, пока предыдущий ещё не закончил, он встаёт в
# очередь и ждёт (а не отменяет текущий и не запускается параллельно).
# Без этого при долгом прогоне (много приложений/разработчиков) параллельные
# запуски начинают пушить из разных версий main и получают
# "non-fast-forward" при push.
concurrency:
  group: update-apps-registry
  cancel-in-progress: false

permissions:
  contents: write  # нужно, чтобы workflow мог закоммитить обновлённый apps.csv

jobs:
  update:
    runs-on: ubuntu-latest
    # Страховка на случай, если прогон где-то зависнет (например, из-за
    # долгих ссылок на разработчиков) — не даёт очереди застрять навечно.
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update registry and push (retries by recomputing on top of latest main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            python update_apps.py

            git add apps.csv
            if git diff --cached --quiet; then
              echo "Изменений нет — нечего коммитить."
              exit 0
            fi
            git commit -m "chore: автообновление реестра приложений"

            if git push; then
              echo "Запушено успешно (попытка $attempt)."
              exit 0
            fi

            echo "Push отклонён (попытка $attempt/3) — main изменился, пока считали (например, из-за ручной правки apps.csv). Откатываюсь на актуальный main и пересчитываю заново с нуля — так надёжнее, чем текстово сшивать два независимо посчитанных CSV."
            git fetch origin
            git reset --hard origin/main
          done

          echo "main продолжает меняться быстрее, чем мы успеваем пересчитать (3 попытки не хватило). Ничего не потеряно — apps.csv в репозитории просто чуть отстанет, следующий плановый запуск подхватит."
          exit 1
